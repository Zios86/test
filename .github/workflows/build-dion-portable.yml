name: Build DION Portable EXE

on:
  push:
    branches:
      - dion-exe-build
    paths:
      - 'dion-hotfix/**'
      - 'dion-quality/**'
      - 'dion-secretary-bot/**'
      - '.github/workflows/build-dion-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = @(
            "dion-portable/part00",
            "dion-portable/part01",
            "dion-portable/part02_03",
            "dion-portable/part04_05",
            "dion-portable/part06_07",
            "dion-portable/part08_09",
            "dion-portable/part10_11",
            "dion-portable/part12_13",
            "dion-portable/part14"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "48feb8875f9c94a160621eaefecc98d3246e8580c5db9c9efa347abe9b5f5ff1") {
            throw "Source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive source.zip src -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply 0.5.1, 0.6 and 0.7 patches
        shell: pwsh
        run: |
          python dion-hotfix/apply_051.py src
          python dion-quality/apply_060.py
          python dion-secretary-bot/apply_070.py src
          python -m compileall -q src/app src/run.py

      - name: Install dependencies and validate 0.7 source
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller huggingface_hub pytest
          python -m pytest -q
          python -c "from pathlib import Path; a=Path('app/audio.py').read_text(encoding='utf-8'); u=Path('app/ui.py').read_text(encoding='utf-8'); t=Path('app/transcriber.py').read_text(encoding='utf-8'); s=Path('app/speakers.py').read_text(encoding='utf-8'); assert '_PA_INSTANCE = None' in a; assert '_PA_OPEN_LOCK' in a; assert 'chunk_seconds.setValue(12)' in u; assert 'DionIntegrationClient' in u; assert 'SecretaryBotController' in u; assert 'SpeakerDiarizationProcess' in t; assert 'OfflineSpeakerDiarization' in s; assert 'condition_on_previous_text=True' in t; print('0.7 source checks passed')"
          python -c "from app.audio import _acquire_pa,_release_pa; p1=_acquire_pa(); p2=_acquire_pa(); assert p1 is p2; _release_pa(); _release_pa(); print('Shared PortAudio context check passed')"
          python -c "import sherpa_onnx; assert getattr(sherpa_onnx,'OfflineSpeakerDiarization',None) is not None; print('sherpa-onnx diarization API available')"

      - name: Download offline models
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundled_models | Out-Null
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir='bundled_models/faster-whisper-small')"
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx" -OutFile "bundled_models/wespeaker_en_voxceleb_resnet34.onnx"
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2" -OutFile "speaker-segmentation.tar.bz2"
          tar -xjf speaker-segmentation.tar.bz2
          Copy-Item "sherpa-onnx-pyannote-segmentation-3-0/model.onnx" "bundled_models/pyannote_segmentation_3_0.onnx"
          $whisper = Get-Item "bundled_models/faster-whisper-small/model.bin"
          if ($whisper.Length -lt 400MB) { throw "Whisper small model is unexpectedly small: $($whisper.Length)" }
          $seg = Get-Item "bundled_models/pyannote_segmentation_3_0.onnx"
          if ($seg.Length -lt 100KB) { throw "Speaker segmentation model is unexpectedly small: $($seg.Length)" }
          python -c "from app.speakers import OfflineSpeakerDiarizer; d=OfflineSpeakerDiarizer('bundled_models/pyannote_segmentation_3_0.onnx','bundled_models/wespeaker_en_voxceleb_resnet34.onnx'); print('Speaker models validated, sample rate:', d.diarizer.sample_rate)"
          Get-ChildItem bundled_models -Recurse | Select-Object FullName,Length

      - name: Build single 0.7 portable EXE
        working-directory: src
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DION_Meeting_Assistant_0.7_Secretary_Bot_Portable" ^
            --collect-all faster_whisper ^
            --collect-all ctranslate2 ^
            --collect-all av ^
            --collect-all sherpa_onnx ^
            --collect-all pyaudiowpatch ^
            --add-data "bundled_models;bundled_models" ^
            run.py

      - name: Self-test packaged EXE
        working-directory: src
        shell: pwsh
        run: |
          $exe = ".\dist\DION_Meeting_Assistant_0.7_Secretary_Bot_Portable.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--portable-selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($p.ExitCode)" }
          Get-FileHash $exe -Algorithm SHA256
          Get-Item $exe | Select-Object Name,Length

      - name: Publish GitHub Release
        working-directory: src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.7-secretary-bot"
          $exe = ".\dist\DION_Meeting_Assistant_0.7_Secretary_Bot_Portable.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          DION Meeting Assistant 0.7 Secretary Bot

          Новое:
          - меню DION → Секретарь-бот → Подключить к комнате;
          - программа создаёт официальный индивидуальный DION-инвайт с именем «Секретарь-бот» через POST /v1/invites;
          - инвайт открывается в отдельном приватном браузерном профиле с выключенным выводом звука, чтобы не дублировать звук пользователя;
          - программа напрямую получает список участников и их открытые/закрытые сессии через DION IAPI;
          - статус показывает, появился ли Секретарь-бот в комнате и сколько участников сейчас активно;
          - ссылка/хэш инвайта и X-Client-Access-Token не записываются в autosave/diagnostics;
          - приглашение можно аннулировать из меню, отдельное окно бота закрывается программой;
          - полноценная offline speaker diarization через sherpa-onnx + pyannote segmentation ONNX остаётся резервным механизмом;
          - количество удалённых голосов не ограничено пятью;
          - speaker engine изолирован в отдельном процессе;
          - перекрывающаяся речь помечается [ПЕРЕБИВАНИЕ];
          - все настройки качества распознавания 0.6 сохранены.

          Важно:
          - документированный DION IAPI пока не предоставляет live active-speaker user_id или отдельные аудиотреки для Windows/Python;
          - DION Audit может фиксировать состояние микрофона пользователя, но включённый микрофон не равен факту речи и поэтому не используется как точное имя говорящего;
          - до появления официального active-speaker/media API определение говорящего выполняется локальной diarization/voice mapping;
          - фактическая работа отдельного гостевого окна и DION-права требуют полевого теста в корпоративной среде.

          SHA-256 EXE: $hash
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title "DION Meeting Assistant 0.7 Secretary Bot" --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "DION Meeting Assistant 0.7 Secretary Bot" --notes $notes --repo $env:GITHUB_REPOSITORY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DION_Meeting_Assistant_0.7_Secretary_Bot_Portable
          path: src/dist/DION_Meeting_Assistant_0.7_Secretary_Bot_Portable.exe
          compression-level: 6
          if-no-files-found: error
