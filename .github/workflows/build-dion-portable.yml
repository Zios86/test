name: Build DION Portable EXE

on:
  pull_request:
    branches:
      - dion-exe-build
    paths:
      - 'dion-hotfix/**'
      - 'dion-quality/**'
      - 'dion-secretary-bot/**'
      - 'dion-hardening/**'
      - 'dion-visual/**'
      - 'dion-guest-bot/**'
      - 'dion-browser-gate/**'
      - 'dion-postprocess/**'
      - 'postprocess-server/**'
      - 'release/model-manifest.json'
      - '.github/workflows/build-dion-portable.yml'
  push:
    branches:
      - dion-exe-build
    paths:
      - 'dion-hotfix/**'
      - 'dion-quality/**'
      - 'dion-secretary-bot/**'
      - 'dion-hardening/**'
      - 'dion-visual/**'
      - 'dion-guest-bot/**'
      - 'dion-browser-gate/**'
      - 'dion-postprocess/**'
      - 'postprocess-server/**'
      - 'release/model-manifest.json'
      - '.github/workflows/build-dion-portable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $parts = @(
            "dion-portable/part00",
            "dion-portable/part01",
            "dion-portable/part02_03",
            "dion-portable/part04_05",
            "dion-portable/part06_07",
            "dion-portable/part08_09",
            "dion-portable/part10_11",
            "dion-portable/part12_13",
            "dion-portable/part14"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "48feb8875f9c94a160621eaefecc98d3246e8580c5db9c9efa347abe9b5f5ff1") {
            throw "Source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive source.zip src -Force

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'

      - name: Apply 0.5.1 through 1.0 patches
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python dion-hotfix/apply_051.py src
          python dion-quality/apply_060.py
          python dion-secretary-bot/apply_070.py src
          python dion-hardening/apply_071.py src
          python dion-visual/apply_080.py src
          python dion-guest-bot/apply_090.py src
          python dion-browser-gate/apply_091.py src
          python dion-postprocess/apply_100.py src
          python -m compileall -q src/app src/run.py

      - name: Install locked dependencies and validate 1.0 source
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pip==26.2.1
          pip install --no-deps -r requirements-ci.lock.txt
          pip check
          python -m pytest -q
          python -c "from pathlib import Path; u=Path('app/ui.py').read_text(encoding='utf-8'); d=Path('app/dion_api.py').read_text(encoding='utf-8'); b=Path('app/dion_bot.py').read_text(encoding='utf-8'); p=Path('app/speaker_profiles.py').read_text(encoding='utf-8'); t=Path('app/transcriber.py').read_text(encoding='utf-8'); a=Path('app/audio.py').read_text(encoding='utf-8'); x=Path('app/postprocess.py').read_text(encoding='utf-8'); assert 'enable_diarization.setChecked(False)' in u; assert 'client_key_password' in d; assert 'cleanup_stale_guest_profiles' in b; assert 'DIONVP2' in p; assert 'word_timestamps=bool(self.speaker_process' in t; assert 'class TranscriptCardView' in u; assert 'MODERN_QSS' in u; assert '#2563EB' in u; assert 'dion_room_url_edit' in u; assert 'dion_api_base_edit' in u; assert 'dion_event_id_edit' not in u; assert 'parse_dion_join_url' in b; assert 'launch_guest_room' in b; assert 'class DionBrowserAdapter' in b; assert 'list_event_users_by_slug' in d; assert 'recording_path' in a; assert 'class PostprocessClient' in x; print('1.0 post-meeting + previous source checks passed')"
          python -c "from app.health import APP_VERSION; import app; assert APP_VERSION == '1.0.0'; assert app.__version__ == '1.0.0'; print('Version checks passed')"
          python -c "import websocket; print('websocket-client available:', websocket.__version__)"
          python -c "from app.dion_bot import parse_dion_join_url; r=parse_dion_join_url('https://dion.example.test/join/example-meeting?showWeb=true'); assert r.host=='dion.example.test'; assert r.slug=='example-meeting'; print('Corporate DION guest URL parse passed')"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from app.ui import MainWindow, TranscriptCardView; MainWindow.refresh_devices=lambda self: None; qapp=QApplication([]); w=MainWindow(); assert w.tabs.count()==7; assert isinstance(w.transcript_view, TranscriptCardView); assert hasattr(w,'dion_room_url_edit'); assert hasattr(w,'secretary_auto_join'); assert w.windowTitle().startswith('DION Meeting Assistant'); w.close(); qapp.processEvents(); print('0.9 Qt offscreen MainWindow smoke passed')"
          python -c "from app.audio import _acquire_pa,_release_pa; p1=_acquire_pa(); p2=_acquire_pa(); assert p1 is p2; _release_pa(); _release_pa(); print('Shared PortAudio context check passed')"
          python -c "import sherpa_onnx; assert getattr(sherpa_onnx,'OfflineSpeakerDiarization',None) is not None; print('sherpa-onnx diarization API available')"

      - name: Download and verify pinned offline models
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force bundled_models | Out-Null
          $manifest = Get-Content "..\release\model-manifest.json" -Raw | ConvertFrom-Json
          $whisperRepo = $manifest.whisper.repository
          $whisperRevision = $manifest.whisper.revision
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id=r'$whisperRepo', revision=r'$whisperRevision', local_dir='bundled_models/faster-whisper-small')"

          Invoke-WebRequest -Uri $manifest.speaker_embedding.url -OutFile "bundled_models/wespeaker_en_voxceleb_resnet34.onnx"
          $embeddingHash = (Get-FileHash "bundled_models/wespeaker_en_voxceleb_resnet34.onnx" -Algorithm SHA256).Hash.ToLower()
          if ($embeddingHash -ne $manifest.speaker_embedding.sha256.ToLower()) { throw "Speaker embedding SHA mismatch: $embeddingHash" }

          Invoke-WebRequest -Uri $manifest.speaker_segmentation.url -OutFile "speaker-segmentation.tar.bz2"
          $segArchiveHash = (Get-FileHash "speaker-segmentation.tar.bz2" -Algorithm SHA256).Hash.ToLower()
          if ($segArchiveHash -ne $manifest.speaker_segmentation.sha256.ToLower()) { throw "Speaker segmentation SHA mismatch: $segArchiveHash" }
          tar -xjf speaker-segmentation.tar.bz2
          Copy-Item "sherpa-onnx-pyannote-segmentation-3-0/model.onnx" "bundled_models/pyannote_segmentation_3_0.onnx"

          $whisper = Get-Item "bundled_models/faster-whisper-small/model.bin"
          if ($whisper.Length -lt 400MB) { throw "Whisper small model is unexpectedly small: $($whisper.Length)" }
          $seg = Get-Item "bundled_models/pyannote_segmentation_3_0.onnx"
          if ($seg.Length -lt 100KB) { throw "Speaker segmentation model is unexpectedly small: $($seg.Length)" }
          python -c "from app.speakers import OfflineSpeakerDiarizer; d=OfflineSpeakerDiarizer('bundled_models/pyannote_segmentation_3_0.onnx','bundled_models/wespeaker_en_voxceleb_resnet34.onnx'); print('Speaker models validated, sample rate:', d.diarizer.sample_rate)"

      - name: Build 1.0 portable EXE
        working-directory: src
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DION_Meeting_Assistant_1.0_Post_Meeting_Precision_Portable" ^
            --collect-all faster_whisper ^
            --collect-all ctranslate2 ^
            --collect-all av ^
            --collect-all sherpa_onnx ^
            --collect-all pyaudiowpatch ^
            --collect-all websocket ^
            --add-data "bundled_models;bundled_models" ^
            run.py

      - name: Self-test packaged EXE
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $exe = ".\dist\DION_Meeting_Assistant_1.0_Post_Meeting_Precision_Portable.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--portable-selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($p.ExitCode)" }
          Get-FileHash $exe -Algorithm SHA256
          Get-Item $exe | Select-Object Name,Length

      - name: Package post-processing server
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "..\postprocess-server\*" -DestinationPath ".\DION_Postprocess_Server_1.0.zip" -Force
          Get-FileHash ".\DION_Postprocess_Server_1.0.zip" -Algorithm SHA256

      - name: Publish immutable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/dion-exe-build'
        working-directory: src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v1.0-post-meeting-precision"
          $exe = ".\dist\DION_Meeting_Assistant_1.0_Post_Meeting_Precision_Portable.exe"
          $server = ".\DION_Postprocess_Server_1.0.zip"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists) { throw "Release $tag already exists; published releases are immutable. Bump the version instead." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $serverHash = (Get-FileHash $server -Algorithm SHA256).Hash.ToLower()
          $notes = Get-Content "RELEASE_NOTES_1.0.md" -Raw
          $notes += "`n`nSHA-256 EXE: $hash`nSHA-256 server ZIP: $serverHash"
          gh release create $tag $exe $server --target $env:GITHUB_SHA --title "DION Meeting Assistant 1.0 Post-meeting Precision" --notes $notes --repo $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DION_Meeting_Assistant_1.0_Post_Meeting_Precision_${{ github.run_id }}
          path: |
            src/dist/DION_Meeting_Assistant_1.0_Post_Meeting_Precision_Portable.exe
            src/DION_Postprocess_Server_1.0.zip
          compression-level: 6
          if-no-files-found: error
