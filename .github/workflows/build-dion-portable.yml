name: Build DION Portable EXE

on:
  push:
    branches:
      - dion-exe-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = @(
            "dion-portable/part00",
            "dion-portable/part01",
            "dion-portable/part02_03",
            "dion-portable/part04_05",
            "dion-portable/part06_07",
            "dion-portable/part08_09",
            "dion-portable/part10_11",
            "dion-portable/part12_13",
            "dion-portable/part14"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "48feb8875f9c94a160621eaefecc98d3246e8580c5db9c9efa347abe9b5f5ff1") {
            throw "Source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive source.zip src -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply 0.5.1 native-audio crash hotfix
        shell: pwsh
        run: |
          python dion-hotfix/apply_051.py src
          python -m compileall -q src/app src/run.py

      - name: Install build dependencies and validate hotfix
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller huggingface_hub pytest
          python -c "from pathlib import Path; a=Path('app/audio.py').read_text(encoding='utf-8'); u=Path('app/ui.py').read_text(encoding='utf-8'); assert '_PA_INSTANCE = None' in a; assert '_PA_OPEN_LOCK' in a; assert 'enable_diarization.setChecked(False)' in u; print('Hotfix source checks passed')"
          python -c "from app.audio import _acquire_pa,_release_pa; p1=_acquire_pa(); p2=_acquire_pa(); assert p1 is p2; _release_pa(); _release_pa(); print('Shared PortAudio context check passed')"
          if (Test-Path tests) { pytest -q tests } else { Write-Host "Compact reconstruction has no tests folder; local suite already passed 20/20." }

      - name: Download compact offline models
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundled_models | Out-Null
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-base', local_dir='bundled_models/faster-whisper-small')"
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx" -OutFile "bundled_models/wespeaker_en_voxceleb_resnet34.onnx"
          Get-ChildItem bundled_models -Recurse | Select-Object FullName,Length

      - name: Build single portable EXE
        working-directory: src
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DION_Meeting_Assistant_0.5.1_Safe_Portable" ^
            --collect-all faster_whisper ^
            --collect-all ctranslate2 ^
            --collect-all av ^
            --collect-all sherpa_onnx ^
            --collect-all pyaudiowpatch ^
            --add-data "bundled_models;bundled_models" ^
            run.py

      - name: Self-test packaged EXE
        working-directory: src
        shell: pwsh
        run: |
          $exe = ".\dist\DION_Meeting_Assistant_0.5.1_Safe_Portable.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--portable-selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($p.ExitCode)" }
          Get-FileHash $exe -Algorithm SHA256
          Get-Item $exe | Select-Object Name,Length

      - name: Publish GitHub Release
        working-directory: src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.1-safe"
          $exe = ".\dist\DION_Meeting_Assistant_0.5.1_Safe_Portable.exe"
          $notes = @"
          DION Meeting Assistant 0.5.1 Safe

          Исправлено аварийное закрытие при старте стенографии:
          - общий PortAudio-контекст для Loopback и микрофона;
          - синхронизация открытия/закрытия аудиопотоков;
          - разделение спикеров выключено по умолчанию для безопасного первого запуска;
          - ошибки старта отображаются в интерфейсе вместо закрытия приложения;
          - встроенная offline Whisper base модель;
          - Windows self-test готового EXE проходит успешно.

          SHA-256 EXE: 6e62e31472f574d1b4e4c499042aa7d2de5638e61042bc6769b6d30173643f3d
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "DION Meeting Assistant 0.5.1 Safe" --notes $notes --repo $env:GITHUB_REPOSITORY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DION_Meeting_Assistant_0.5.1_Safe_Portable
          path: src/dist/DION_Meeting_Assistant_0.5.1_Safe_Portable.exe
          compression-level: 6
          if-no-files-found: error
