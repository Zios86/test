name: Build DION Portable EXE

on:
  push:
    branches:
      - dion-exe-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = @(
            "dion-portable/part00",
            "dion-portable/part01",
            "dion-portable/part02_03",
            "dion-portable/part04_05",
            "dion-portable/part06_07",
            "dion-portable/part08_09",
            "dion-portable/part10_11",
            "dion-portable/part12_13",
            "dion-portable/part14"
          )
          $b64 = ($parts | ForEach-Object { Get-Content $_ -Raw }) -join ""
          [IO.File]::WriteAllBytes("source.zip", [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash "source.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "48feb8875f9c94a160621eaefecc98d3246e8580c5db9c9efa347abe9b5f5ff1") {
            throw "Source checksum mismatch: $hash"
          }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive source.zip src -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply stability and recognition patches
        shell: pwsh
        run: |
          python dion-hotfix/apply_051.py src
          python dion-quality/apply_060.py
          python -m compileall -q src/app src/run.py

      - name: Install dependencies and validate Quality profile
        working-directory: src
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller huggingface_hub pytest
          python -c "from pathlib import Path; a=Path('app/audio.py').read_text(encoding='utf-8'); u=Path('app/ui.py').read_text(encoding='utf-8'); t=Path('app/transcriber.py').read_text(encoding='utf-8'); assert '_PA_INSTANCE = None' in a; assert '_PA_OPEN_LOCK' in a; assert 'enable_diarization.setChecked(False)' in u; assert 'chunk_seconds.setValue(12)' in u; assert 'hotwords=self.hotwords_edit.text()' in u; assert 'beam_size=self.beam_size' in t; assert 'condition_on_previous_text=True' in t; print('0.6 Quality source checks passed')"
          python -c "from app.audio import _acquire_pa,_release_pa; p1=_acquire_pa(); p2=_acquire_pa(); assert p1 is p2; _release_pa(); _release_pa(); print('Shared PortAudio context check passed')"
          python -c "from inspect import signature; from faster_whisper import WhisperModel; p=signature(WhisperModel.transcribe).parameters; assert 'hotwords' in p; assert 'initial_prompt' in p; assert 'vad_parameters' in p; print('faster-whisper Quality options available')"
          python -c "import queue; from app.transcriber import TranscriptionWorker; w=TranscriptionWorker(input_queue=queue.Queue(),hotwords='DION, Naumen, dion'); assert w.hotwords=='DION, Naumen'; w._remember('system','запрос на уточнение в Naumen'); assert 'запрос на уточнение' in w._initial_prompt('system'); items=[{'start':0.0,'end':1.0,'speaker':'DION / участник','speaker_key':None,'text':'Нужно проверить'},{'start':1.2,'end':2.0,'speaker':'DION / участник','speaker_key':None,'text':'комментарии в заявке'}]; assert len(w._merge_candidates(items))==1; print('Quality logic checks passed')"

      - name: Download offline quality models
        working-directory: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundled_models | Out-Null
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-small', local_dir='bundled_models/faster-whisper-small')"
          Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/wespeaker_en_voxceleb_resnet34.onnx" -OutFile "bundled_models/wespeaker_en_voxceleb_resnet34.onnx"
          $model = Get-Item "bundled_models/faster-whisper-small/model.bin"
          if ($model.Length -lt 400MB) { throw "Whisper small model is unexpectedly small: $($model.Length)" }
          Get-ChildItem bundled_models -Recurse | Select-Object FullName,Length

      - name: Build single Quality portable EXE
        working-directory: src
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DION_Meeting_Assistant_0.6_Quality_Portable" ^
            --collect-all faster_whisper ^
            --collect-all ctranslate2 ^
            --collect-all av ^
            --collect-all sherpa_onnx ^
            --collect-all pyaudiowpatch ^
            --add-data "bundled_models;bundled_models" ^
            run.py

      - name: Self-test packaged EXE
        working-directory: src
        shell: pwsh
        run: |
          $exe = ".\dist\DION_Meeting_Assistant_0.6_Quality_Portable.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--portable-selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($p.ExitCode)" }
          Get-FileHash $exe -Algorithm SHA256
          Get-Item $exe | Select-Object Name,Length

      - name: Publish GitHub Release
        working-directory: src
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.6-quality"
          $exe = ".\dist\DION_Meeting_Assistant_0.6_Quality_Portable.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          DION Meeting Assistant 0.6 Quality

          Улучшение распознавания русской речи по результатам реальной стенограммы DION:
          - полноценная offline Whisper small вместо base;
          - beam search 5 вместо greedy beam 1;
          - контекст предыдущих реплик между аудиофрагментами;
          - редактируемый словарь терминов, ФИО и названий систем;
          - встроенный словарь DION / Naumen / Service Desk / КСПД / ALT Linux / WMS и терминов техподдержки;
          - VAD настроен для сохранения коротких русских слов;
          - соседние короткие сегменты одного говорящего объединяются в цельную реплику;
          - длина фрагмента по умолчанию увеличена с 8 до 12 секунд;
          - исправление безопасного общего PortAudio-контекста из 0.5.1 сохранено;
          - разделение спикеров по-прежнему выключено по умолчанию для стабильности.

          Рекомендация: перед ВКС добавьте в поле «Словарь» фамилии участников и названия систем конкретной встречи.

          SHA-256 EXE: $hash
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title "DION Meeting Assistant 0.6 Quality" --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "DION Meeting Assistant 0.6 Quality" --notes $notes --repo $env:GITHUB_REPOSITORY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DION_Meeting_Assistant_0.6_Quality_Portable
          path: src/dist/DION_Meeting_Assistant_0.6_Quality_Portable.exe
          compression-level: 6
          if-no-files-found: error
