name: Finalize 0.9 release journal

on:
  push:
    branches: [dion-exe-build]
    paths: ['.github/workflows/finalize-0.9-release-journal.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dion-exe-build
      - name: Update append-only journal
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/VERSION_JOURNAL.md')
          s = p.read_text(encoding='utf-8')
          old = '''**0.9 Guest Secretary Bot** — текущая development candidate на ветке `dion-guest-bot-0.9`; implemented/tested локально, **не опубликована**.\n\nТекущий опубликованный релиз и основной rollback: **0.8 Visual Refresh**.\n\nСтабильные резервные точки для отката: **0.8 Visual Refresh**, **0.7.1 Hardening**, **0.7 Secretary Bot**, **0.6 Quality**, **0.5.1 Safe** в зависимости от характера регрессии.'''
          new = '''**0.9 Guest Secretary Bot** — текущий опубликованный релиз (`v0.9-guest-secretary-bot`).\n\nОсновной опубликованный rollback: **0.8 Visual Refresh**.\n\nСтабильные резервные точки для отката: **0.8 Visual Refresh**, **0.7.1 Hardening**, **0.7 Secretary Bot**, **0.6 Quality**, **0.5.1 Safe** в зависимости от характера регрессии.'''
          if old not in s:
              raise SystemExit('Current-version marker not found')
          s = s.replace(old, new, 1)
          marker = '## 2026-08-28.04 — 0.9 Guest Secretary Bot: room-URL-first guest flow'
          if marker not in s:
              raise SystemExit('0.9 candidate journal marker not found')
          release_entry = '''## 2026-08-28.05 — v0.9 Guest Secretary Bot опубликован\n\n- Версия/ветка: `v0.9-guest-secretary-bot`, `dion-exe-build`\n- Тип: `release`, `build`, `docs`\n- Статус: `released`\n- Цель: зафиксировать фактический выпуск реализации 0.9, описанной в записи `2026-08-28.04`, после успешных Windows PR и production gates.\n\n### Проверка\n\n- PR #4 Windows CI `33150603611` — success: source validation, pinned offline models, PyInstaller build и packaged `--portable-selftest`; Release step skipped by design.\n- Merge commit: `f5ae18ef98d26236e9c7f5f42aa5b7e685c5a7e6`.\n- Production Windows CI `33150927129` — success: tests, pinned models, EXE build, packaged self-test и GitHub Release publication.\n\n### Release/артефакт\n\n- Release: `https://github.com/Zios86/test/releases/tag/v0.9-guest-secretary-bot`\n- Artifact: `DION_Meeting_Assistant_0.9_Guest_Secretary_Bot_Portable.exe`\n- Размер: `627,722,376 bytes`\n- SHA-256: `3e57b7c1fac965a14518d6eecc86642bcd3367af1fcf66af01e71142c09aef22`\n- Target commit: `f5ae18ef98d26236e9c7f5f42aa5b7e685c5a7e6`\n\n### Ограничения/риски\n\nRelease/CI не доказывает реальную корпоративную DION guest-form/DOM совместимость, waiting-room behavior, browser active-speaker semantics, browser↔WASAPI timing или длительную стабильность реального аудио. Основной STT media source остаётся Windows WASAPI Loopback.\n\n### Откат\n\nОсновной опубликованный rollback: `v0.8-visual-refresh`.\n\n---\n\n'''
          s = s.replace(marker, release_entry + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit journal update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VERSION_JOURNAL.md
          git commit -m "Record published 0.9 release in version journal"
          git push origin HEAD:dion-exe-build
